services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: expensior
      POSTGRES_PASSWORD: expensior
      POSTGRES_DB: expensior
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensior -d expensior"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
